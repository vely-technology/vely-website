name: Deploy Vely website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify website
        run: npm run lint && npm run typecheck && npm run test

      - name: Build static website
        run: npm run build
        env:
          GITHUB_PAGES_CUSTOM_DOMAIN: "true"
          NEXT_PUBLIC_SITE_URL: https://joinvely.com
          NEXT_PUBLIC_PLAY_STORE_URL: https://play.google.com/store/apps/details?id=com.vely.app
          NEXT_PUBLIC_GA_MEASUREMENT_ID: G-NVNG7NVEME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
